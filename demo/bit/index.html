<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><title>Bit — Live 3D</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--ink:#eff5fc;--muted:#9aafc4;--line:#273849;--yes:#ffd24c;--no:#ff7964}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif;display:grid;grid-template-columns:minmax(0,780px);justify-content:center;align-content:center;padding:36px 24px}::selection{background:var(--yes);color:var(--bg)}main{width:100%;min-width:0}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.12em}#state{font-size:13px;display:flex;gap:9px;align-items:center;color:var(--muted)}#state:before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}.screen{position:relative;height:clamp(310px,50vh,490px);background:transparent;overflow:hidden}video{width:100%;height:100%;display:block;object-fit:contain}#stage canvas{display:block;max-width:100%;width:100%!important;height:100%!important}#message{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#080b10;color:var(--muted);font-size:14px}#message[hidden]{display:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.choice{min-height:76px;display:flex;align-items:center;justify-content:center;gap:18px;border:1px solid var(--line);border-radius:4px;background:transparent;font-weight:600;line-height:1;font-family:inherit;font-size:22px;letter-spacing:.02em;cursor:pointer;transition:background .15s,border-color .15s,transform .15s;color:var(--ink)}.choice svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.5}.yes{color:var(--yes)}.no{color:var(--no)}.yes:hover,.yes[aria-pressed=true]{background:#ffd24c12;border-color:var(--yes)}.no:hover,.no[aria-pressed=true]{background:#ff796412;border-color:var(--no)}.choice:active{transform:translateY(1px)}.choice:disabled{opacity:.35;cursor:wait}.choice:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:5px}.scrub{margin-top:28px}label{font-size:12px;color:var(--muted)}input[type=range]{display:block;width:100%;margin:12px 0 8px;accent-color:#b6cee5;height:20px;cursor:ew-resize}.markers{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}footer{margin-top:28px;text-align:center;font-size:12px;line-height:1.8;color:var(--muted)}kbd{font:inherit;color:var(--ink)}a{color:inherit;text-underline-offset:3px}#state[data-mode=yes]{color:var(--yes)}#state[data-mode=no]{color:var(--no)}@media(max-width:520px){.screen{height:340px}body{padding:24px 18px}header{margin-bottom:22px}.controls{gap:12px;margin-top:20px}.choice{min-height:68px}.scrub{margin-top:24px}}@media(prefers-reduced-motion:reduce){.choice{transition:none}}
</style></head><body><main aria-label="Live 3D Bit"><header><h1>BIT</h1><div id="state" data-mode="loading" role="status" aria-live="polite">Neutral</div></header><div class="screen" id="stage"><div id="message">Waking up Bit…</div></div><div class="controls"><button class="choice yes" id="yes" aria-pressed="false" disabled><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2 25 14 14 26 3 14Z M3 14h22 M14 2v24"/></svg>Yes</button><button class="choice no" id="no" aria-pressed="false" disabled><svg viewBox="0 0 28 28" aria-hidden="true"><path d="m14 1 3 8 8-5-5 9 7 4-10 1-3 9-3-9-10-1 7-4-5-9 8 5Z"/></svg>No</button></div><footer>Tap a response or press <kbd>Y</kbd> / <kbd>N</kbd>.<br>Bit returns to neutral after each answer.<br><a href="https://www.youtube.com/watch?v=j3geresa7-Y" target="_blank" rel="noopener noreferrer">Original audio &amp; motion reference</a></footer></main>
<script src="./app.js"></script></body></html>
