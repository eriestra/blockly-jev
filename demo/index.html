<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blockly Jev demo</title>
  <style>
    :root { --bg: #f6f5f2; --ink: #1c1b1a; --panel: #ffffff; --line: #d9d6cf; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
    header h1 { font-size: 16px; margin: 0; flex: 1; }
    button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
    button.primary { background: #6a3d9a; color: #fff; border-color: #6a3d9a; }
    main { display: grid; grid-template-columns: 1fr 380px; height: calc(100vh - 49px); }
    #blockly { height: 100%; }
    aside { border-left: 1px solid var(--line); display: grid; grid-template-rows: auto auto auto 1fr auto 1fr; background: var(--panel); min-height: 0; }
    select { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: #fff; max-width: 40vw; }
    #lesson-text { padding: 12px; font-size: 13px; line-height: 1.5; border-bottom: 1px solid var(--line); }
    #lesson-text h3 { margin: 0 0 6px; font-size: 15px; }
    #lesson-text p { margin: 0 0 8px; }
    #lesson-text b { color: #6a3d9a; }
    aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); color: #6b6864; }
    pre { margin: 0; padding: 12px; overflow: auto; font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
    #output { border-top: 1px solid var(--line); }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 60vh 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
  </style>
</head>
<body>
  <header>
    <h1>Blockly + Jev</h1>
    <a href="https://github.com/eriestra/blockly-jev" style="color:#6a3d9a">GitHub</a>
    <select id="lesson" aria-label="Lesson"></select>
    <button id="reset">Reset lesson</button>
    <button id="run" class="primary">Run</button>
  </header>
  <main>
    <div id="blockly"></div>
    <aside>
      <h2>Lesson</h2>
      <div id="lesson-text"></div>
      <h2>Generated JavaScript</h2>
      <pre id="code"></pre>
      <h2>Output</h2>
      <pre id="output"></pre>
    </aside>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
