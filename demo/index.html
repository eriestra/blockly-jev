<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blockly + Jev</title>
  <meta name="description" content="Learn to code with blocks that can judge: ten lessons using TypeSafe Jev inside Blockly." />
  <style>
    :root {
      --bone: #f5f2ec; --paper: #fbf9f5; --ink: #17130f; --body: #4a433c; --muted: #8a8178; --rule: #ddd7cc;
      --mark: #b5622d; --shell: #c8873c; --verified: #2e7d5b; --violet: #7557c7;
      --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --shadow: 0 12px 30px rgba(23,19,15,.08);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font: 14px/1.5 var(--sans); background: var(--bone); color: var(--body); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
    header, .rail-wrap { flex: none; }
    a { color: var(--mark); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .eyebrow { font: 10.5px/1.2 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--shell); }

    /* ---- header ---- */
    header { display: flex; align-items: center; gap: 18px; padding: 14px 24px; }
    .brand { display: flex; align-items: baseline; gap: 10px; flex: 1; min-width: 0; }
    .brand h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.025em; color: var(--ink); white-space: nowrap; }
    .brand span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn { font: 600 13.5px/1 var(--sans); padding: 11px 18px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, background .12s ease; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(23,19,15,.10); }
    .btn:active { transform: translateY(0); }
    .btn.primary { background: var(--mark); border-color: var(--mark); color: #fff; padding-left: 22px; padding-right: 22px; }
    .btn.primary[disabled] { opacity: .6; cursor: progress; transform: none; box-shadow: none; }
    .btn.ghost { background: transparent; }
    .btn.icon { width: 38px; height: 38px; padding: 0; display: inline-grid; place-items: center; font-size: 16px; }

    /* ---- lesson rail ---- */
    .rail-wrap { display: flex; align-items: center; gap: 10px; padding: 4px 24px 14px; }
    .rail { flex: 1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; position: relative; overflow-x: auto; scrollbar-width: none; }
    .rail::-webkit-scrollbar { display: none; }
    .step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 2px 4px; border: 0; background: transparent; cursor: pointer; font: inherit; color: var(--muted); min-width: 64px; border-radius: 12px; transition: background .12s ease; }
    .step:hover { background: rgba(23,19,15,.04); }
    .step::before, .step::after { content: ""; position: absolute; top: 20px; height: 2px; background: var(--rule); width: 50%; z-index: 0; }
    .step::before { left: 0; } .step::after { right: 0; }
    .step:first-child::before, .step:last-child::after { display: none; }
    .step.done::before, .step.done::after, .step.active::before { background: var(--verified); }
    .dot { position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 12.5px/1 var(--sans); background: var(--paper); border: 2px solid var(--rule); color: var(--body); transition: transform .15s ease, background .15s ease, border-color .15s ease; }
    .step:hover .dot { transform: scale(1.08); }
    .step.done .dot { background: var(--verified); border-color: var(--verified); color: #fff; }
    .step.active .dot { background: var(--mark); border-color: var(--mark); color: #fff; box-shadow: 0 0 0 5px rgba(181,98,45,.18); }
    .step .label { font-size: 11.5px; line-height: 1.25; text-align: center; max-width: 110px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .step.active .label { color: var(--ink); font-weight: 600; }
    .step.done .label { color: var(--body); }

    /* ---- main ---- */
    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 18px; padding: 0 24px 20px; }
    .canvas { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--rule); background: var(--paper); min-width: 0; min-height: 0; }
    #blockly { width: 100%; height: 100%; }
    aside { display: grid; grid-template-rows: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; min-height: 0; }
    .card { background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .card > :last-child { flex: 1; min-height: 0; overflow: auto; }
    .card-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px 0; }
    .card-head .eyebrow { flex: 1; }
    .pill { font: 600 11px/1 var(--sans); padding: 5px 9px; border-radius: 999px; background: var(--bone); color: var(--body); border: 1px solid var(--rule); }
    .pill.violet { background: rgba(117,87,199,.12); color: var(--violet); border-color: transparent; }
    .pill.green { background: rgba(46,125,91,.12); color: var(--verified); border-color: transparent; }
    #lesson-text { padding: 8px 16px 14px; font-size: 13.5px; line-height: 1.55; }
    #lesson-text .lead { color: var(--ink); font-weight: 500; }
    .challenge { margin-top: 12px; padding: 12px 14px; background: var(--bone); border: 1px solid var(--rule); border-radius: 12px; }
    .challenge p { margin: 0 0 8px; }
    .hints { margin: 0 0 8px; padding-left: 20px; color: var(--body); }
    .hints:empty { display: none; }
    .hints li { margin: 4px 0; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn.small { padding: 8px 13px; font-size: 12.5px; }
    .btn[disabled] { opacity: .55; cursor: default; transform: none; box-shadow: none; }
    .verdict { margin: 10px 0 0; padding: 9px 12px; border-radius: 10px; font-weight: 500; }
    .verdict.pass { background: rgba(46,125,91,.12); color: var(--verified); }
    .verdict.fail { background: rgba(181,98,45,.12); color: #8f4a1f; }
    #lesson-text h3 { margin: 4px 0 8px; font-size: 18px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); }
    #lesson-text p { margin: 0 0 8px; }
    #lesson-text p:last-child { margin-bottom: 0; }
    .tag { display: inline-block; font: 700 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; margin-right: 6px; vertical-align: 1px; }
    .tag.jev { background: rgba(117,87,199,.12); color: var(--violet); }
    .tag.try { background: rgba(200,135,60,.16); color: #9a6524; }
    pre { margin: 0; padding: 12px 16px 14px; font: 12px/1.5 var(--mono); color: var(--ink); white-space: pre-wrap; word-break: break-word; }
    #output { font-size: 12.5px; }
    #output .line { padding: 2px 0; }
    #output .line + .line { border-top: 1px dashed var(--rule); }
    #output .done { color: var(--verified); font-weight: 600; }
    #output .error { color: var(--mark); font-weight: 600; }
    #output .idle { color: var(--muted); }

    @media (max-width: 900px) {
      body { overflow: auto; display: block; }
      header { padding: 12px 16px; flex-wrap: wrap; }
      .brand span { display: none; }
      .rail-wrap { padding: 4px 16px 12px; }
      .rail { grid-template-columns: repeat(10, minmax(72px, 1fr)); }
      main { grid-template-columns: 1fr; padding: 0 16px 16px; }
      .canvas { height: 62vh; order: -1; }
      aside { grid-template-rows: auto auto auto; }
      .card > :last-child { max-height: 45vh; }
    }
  </style>
  <script type="module" src="./main.ts"></script>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Blockly + Jev</h1>
      <span>Ten lessons. Blocks that can judge.</span>
    </div>
    <a href="https://github.com/eriestra/blockly-jev">GitHub</a>
    <button id="reset" class="btn ghost">Reset lesson</button>
    <button id="run" class="btn primary">Run</button>
  </header>
  <div class="rail-wrap">
    <button id="prev" class="btn icon" aria-label="Previous lesson">‹</button>
    <nav id="rail" class="rail" aria-label="Lessons"></nav>
    <button id="next" class="btn icon" aria-label="Next lesson">›</button>
  </div>
  <main>
    <aside>
      <section class="card">
        <div class="card-head"><span class="eyebrow" id="lesson-eyebrow">Lesson</span><span class="pill" id="calls"></span></div>
        <div id="lesson-text"></div>
      </section>
      <section class="card">
        <div class="card-head"><span class="eyebrow">Generated JavaScript</span></div>
        <pre id="code"></pre>
      </section>
      <section class="card">
        <div class="card-head"><span class="eyebrow">Output</span><span class="pill green" id="status" hidden></span></div>
        <pre id="output"></pre>
      </section>
    </aside>
    <div class="canvas"><div id="blockly"></div></div>
  </main>
</body>
</html>
